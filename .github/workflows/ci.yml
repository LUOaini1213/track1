name: ci

# No model key, Codex install or container engine is needed. The OTLP recovery
# check uses loopback HTTP only.
#
# That is by design:
#   - `codex-runner.live.test.ts` runs `fixtures/fake-codex.js`, not real Codex;
#   - `replay-runner.test.ts` uses `RUNTIME_PROVIDER=replay` to feed recorded
#     Codex events through the real parse / trace / redact / policy path, so the
#     whole control plane is exercised without a key;
#   - only the engine-free parts of the container path are tested.
#
# Windows is in the matrix because the README recommends the Windows host POC
# and the OTLP measurements were taken on Windows. The suite uses real HTTP,
# files and child processes, so it has to pass there, not only on Linux.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 22 is the lower bound in package.json `engines`; 24 is the version
        # used for development. Declaring a lower bound means proving it runs.
        os: [ubuntu-latest]
        node-version: ["22", "24"]
        include:
          - os: windows-latest
            node-version: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        # `npm ci`, not `npm install`: install exactly what the lockfile says,
        # otherwise a red run says nothing about the code.
        run: npm ci
      - name: Evidence and documentation numbers
        # Every measured number in README.md and docs/OTLP_DELIVERY.md must
        # equal the committed evidence JSON, that JSON's source hashes must
        # match the current files, and relative links in the docs must resolve.
        run: npm run check:evidence
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke - start the built artefact and ask it one question
        # This once caught a production entry point that would not start while
        # typecheck, tests and build were all green: the contract package
        # exported TypeScript source, which tsc, vitest and Vite each resolve,
        # and only a real `node dist/index.js` exposed it.
        run: npm run smoke
      - name: Replay smoke - complete, fail, and deny real HTTP runs
        run: npm run smoke:replay
      - name: OTLP smoke - 503, timeout and killed-process recovery
        run: npm run smoke:otlp
